version: '3.8'

services:
  # NestJS 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gimcstar-app
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=gimcstar
      - DB_PASSWORD=gimcstar123
      - DB_DATABASE=gimcstar
      - POSTGRES_HOST=192.168.102.168
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=crawler_db_v2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-jwt-secret-key-here
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=your-jwt-refresh-secret-key-here
      - JWT_REFRESH_EXPIRES_IN=30d
    depends_on:
      - mysql
      - postgres
      - redis
    networks:
      - gimcstar-network
    restart: unless-stopped

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: gimcstar-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=gimcstar
      - MYSQL_USER=gimcstar
      - MYSQL_PASSWORD=gimcstar123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DBcsv:/docker-entrypoint-initdb.d
    networks:
      - gimcstar-network
    restart: unless-stopped

  # PostgreSQL 数据库
  postgres:
    image: postgres:15
    container_name: gimcstar-postgres
    environment:
      - POSTGRES_DB=gimcstar
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DBcsv:/docker-entrypoint-initdb.d
    networks:
      - gimcstar-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: gimcstar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gimcstar-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx 反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: gimcstar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - gimcstar-network
    restart: unless-stopped

volumes:
  mysql_data:
  postgres_data:
  redis_data:

networks:
  gimcstar-network:
    driver: bridge