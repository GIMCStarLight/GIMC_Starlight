# 爬虫系统日志轮转配置
# 部署到服务器: /etc/logrotate.d/crawler

# Nginx日志轮转
/www/wwwlogs/crawler-*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    dateext
    dateformat -%Y%m%d
    postrotate
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 `cat /var/run/nginx.pid`
        fi
    endscript
}

# 应用日志轮转（PM2管理的日志）
/www/wwwroot/gimcstar_proudction_env/gimcstar/logs/*.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    size 100M
    dateext
    dateformat -%Y%m%d
    copytruncate
    postrotate
        # 通知PM2重新加载日志
        pm2 reloadLogs 2>/dev/null || true
    endscript
}

# Backend日志单独配置（更长保留期）
/www/wwwroot/gimcstar_proudction_env/gimcstar/backend/src/logs/*.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    size 50M
    dateext
    dateformat -%Y%m%d
    copytruncate
}

# Python任务系统日志
/www/wwwroot/gimcstar_proudction_env/gimcstar/task_control/reports/*.json {
    weekly
    rotate 4
    missingok
    notifempty
    compress
    delaycompress
    size 10M
}
