name: 功能请求
description: 提出一个新功能或改进建议
title: "feat: "
labels: [enhancement]
assignees: []
body:
  - type: textarea
    id: motivation
    attributes:
      label: 背景与动机
      description: 为什么需要该功能，解决什么问题
      placeholder: 背景、痛点与目标
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案描述
      description: 描述你期望的行为、API 或界面
      placeholder: 具体功能点与可能的实现思路
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法及其取舍
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 范围与影响
      description: 涉及模块、风险与迁移需求
    validations:
      required: false